[package]
name = "content-rd"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chromiumoxide = "0.9.1"
futures-util = "0.3.34"
maud = "0.27.0"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "form", "gzip", "json", "query", "rustls"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "net", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
